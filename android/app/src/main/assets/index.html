<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark light"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>HAL Atlas</title><link rel="stylesheet" href="style4.css"></head><body><div class="atlas-shell">
  <div class="workspace-main">
    <header class="app-header">
      <strong class="atlas-wordmark">HAL Atlas</strong><button class="status-pill" data-action="health"><span id="connection-state">Offline</span></button><span id="session-state" hidden></span>
      <div class="header-actions">
        <button id="theme-toggle" class="icon-button" aria-label="Dark mode" aria-pressed="true">☾</button>
        <button id="refresh" class="icon-button" aria-label="Refresh market data">↻</button>
        <button id="settings" class="icon-button" aria-label="Settings and connections">⚙</button>
      </div>
    </header>
    <div id="notice" role="status" hidden></div>
    <main id="main" tabindex="-1"></main><nav class="bottom-tabs" aria-label="Main navigation"><button data-route="position" data-sub="overview" data-screen="portfolio"><span aria-hidden="true">▤</span>Portfolio</button><button data-route="position" data-sub="snapshot" data-screen="market"><span aria-hidden="true">⌁</span>Market</button><button data-route="position" data-sub="brief" data-screen="research"><span aria-hidden="true">▥</span>Research</button></nav>
  </div>
</div><div id="toast" role="status" hidden></div><div id="modal" class="modal-layer" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="section-heading"><h2 id="modal-title"></h2><button id="modal-close" class="icon-button" aria-label="Close dialog">×</button></div><div id="modal-body"></div><p id="modal-error" role="alert"></p><div class="modal-footer"><button id="modal-cancel">Cancel</button><button id="modal-save" class="primary">Save</button></div></section></div><script src="desk4.js"></script><script src="nse4.js"></script></body></html>
