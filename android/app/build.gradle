plugins { id 'com.google.devtools.ksp'; id 'com.android.application'; id 'com.google.protobuf'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose' }
android {
    namespace 'in.smkt.haldesk'
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig {
        applicationId 'in.smkt.haldesk'
        minSdk 26
        targetSdk 35
        versionCode 61
        versionName '5.5.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    buildTypes { release { minifyEnabled false } }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            ['https.proxyHost','https.proxyPort','http.proxyHost','http.proxyPort','javax.net.ssl.trustStore'].each { name ->
                if (System.getProperty(name)) systemProperty name, System.getProperty(name)
            }
        }
    }
    packaging { jniLibs { useLegacyPackaging = true } }
}


protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:3.25.5' }
    generateProtoTasks {
        all().configureEach { task ->
            task.builtins { java { option 'lite' } }
        }
    }
}
dependencies {
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation platform('androidx.compose:compose-bom:2025.02.00')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.material3:material3'
    implementation 'com.google.protobuf:protobuf-javalite:3.25.5'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'org.json:json:20250517'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}


// A stale generated bundle must never ship after editing its source.
// Generated JS and its manifest are derived build outputs, never hand-edited
// or checked into the repository. Rebuild before validating/packaging assets.
tasks.register('generateWebAssets', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'scripts/build-assets.js'
}
tasks.register('verifyWebAssets') {
    dependsOn('generateWebAssets')
    doLast {
        def hashes = new groovy.json.JsonSlurper().parse(rootProject.file('web-assets-sha256.json'))
        hashes.each { name, expected ->
            def digest = java.security.MessageDigest.getInstance('SHA-256').digest(file('src/main/assets/' + name).bytes).encodeHex().toString()
            if (digest != expected) throw new GradleException('Web assets changed: run npm ci && npm run assets before building.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn('verifyWebAssets') }
