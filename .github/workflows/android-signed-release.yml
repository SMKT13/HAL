name: HAL signed Android update

on:
  workflow_dispatch:
  push:
    branches:
      - ci/hal28-signed-build-20261020

permissions:
  contents: read

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out merged HAL source
        uses: actions/checkout@v4
      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK 35 build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Restore original private signing identity
        shell: bash
        env:
          SIGNING_KEY_B64: ${{ secrets.HAL_SIGNING_JKS_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.HAL_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEY_B64" || -z "$SIGNING_PASSWORD" ]]; then
            echo "Missing required repository secrets HAL_SIGNING_JKS_BASE64 / HAL_SIGNING_PASSWORD. Cannot sign an update to the installed app." >&2
            exit 1
          fi
          umask 077
          mkdir -p android/signing
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > android/signing/personal.jks
          printf '%s' "$SIGNING_PASSWORD" > android/signing/password.txt
      - name: Build and verify signed Android update
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          set -euo pipefail
          HAL_UNSIGNED_ONLY=0 ANDROID_SDK_ROOT="$ANDROID_HOME" bash android/build.sh
      - name: Upload signed APK for private download
        uses: actions/upload-artifact@v4
        with:
          name: HAL-Desk-v2.8-signed
          path: android/build/HAL-Desk-v2.8.apk
          retention-days: 3
          if-no-files-found: error
      - name: Remove temporary signing files
        if: always()
        run: |
          rm -f android/signing/personal.jks android/signing/password.txt

