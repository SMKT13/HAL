name: One-time HAL Desk 3.2 signed candidate
on:
  push:
    branches:
      - feat/android-offline-finbert-20261025
    paths:
      - .github/workflows/hal-sign-3-2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sign-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Restore existing signing identity
        env:
          SIGNING_KEY_B64: ${{ secrets.HAL_SIGNING_JKS_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.HAL_SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEY_B64" || -z "$SIGNING_PASSWORD" ]]; then
            echo "Original signing identity not configured: HAL_SIGNING_JKS_BASE64 / HAL_SIGNING_PASSWORD." >&2
            exit 1
          fi
          umask 077
          mkdir -p android/signing
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > android/signing/personal.jks
          printf '%s' "$SIGNING_PASSWORD" > android/signing/password.txt
      - name: Build, sign and verify v3.2
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: HAL_UNSIGNED_ONLY=0 ANDROID_SDK_ROOT="$ANDROID_HOME" bash android/build.sh
      - name: Share signed APK privately
        uses: actions/upload-artifact@v4
        with:
          name: HAL-Desk-v3.2-signed
          path: android/build/HAL-Desk-v3.2.apk
          retention-days: 3
          if-no-files-found: error
      - name: Destroy signing inputs
        if: always()
        run: rm -f android/signing/personal.jks android/signing/password.txt
