name: Prepare HAL Android signing tools
on:
  push:
    branches: [work/hal-private-signing-tools]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    steps:
      - name: Install official Android build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"'
      - name: Package public signing and verification tools
        shell: bash
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p package/build-tools/35.0.0
          cp -a "$bt/apksigner" "$bt/zipalign" "$bt/aapt" "$bt/lib" "$bt/lib64" "$bt/source.properties" package/build-tools/35.0.0/
          tar -czf android-signing-tools-35.0.0.tar.gz -C package build-tools
          sha256sum android-signing-tools-35.0.0.tar.gz > android-signing-tools-35.0.0.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: HAL-public-Android-signing-tools-35.0.0
          path: |
            android-signing-tools-35.0.0.tar.gz
            android-signing-tools-35.0.0.sha256
          retention-days: 3
          if-no-files-found: error
