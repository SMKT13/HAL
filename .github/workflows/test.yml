name: HAL regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:python
      - run: npm test
      - run: npm run test:android
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: node tests/ui.test.js
        working-directory: android
      - run: node tests/news-ai.test.js
        working-directory: android
      - run: node tests/ai-ui.test.js
        working-directory: android
      - run: node tests/intelligence-ui.test.js
        working-directory: android
      - run: node tests/desk-ui.test.js
        working-directory: android
      - name: Capture QA previews of HAL redesigned screens
        uses: actions/upload-artifact@v4
        with:
          name: HAL-Desk-v3.2-design-preview
          path: |
            android/tests/.output/overview-dark.png
            android/tests/.output/risk-dark.png
            android/tests/.output/gemini-ai-light.png
          retention-days: 3
          if-no-files-found: error
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - run: HAL_UNSIGNED_ONLY=1 ANDROID_SDK_ROOT="$ANDROID_HOME" bash android/build.sh
      - run: gradle --no-daemon :app:testReleaseUnitTest
        working-directory: android
      - run: bash android/tests/test-native-ai.sh
      - name: Prepare verified SDK APK signing tool for private offline signing
        run: cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android/build/apksigner.jar
      - name: Upload unsigned candidate (no signing secrets)
        uses: actions/upload-artifact@v4
        with:
          name: HAL-Desk-v3.2-unsigned-and-apksigner
          path: |
            android/build/aligned.apk
            android/build/apksigner.jar
          retention-days: 2
          if-no-files-found: error

