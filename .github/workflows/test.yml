name: HAL regression tests
on:
  push:
  pull_request:
jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/*.test.js

      - run: node android/tests/core.test.js && node --test android/tests/analytics.test.js
