name: HAL desktop, finance and Android regression tests

# Avoid duplicate full builds for every draft-branch commit. These suites are
# heavyweight and private-repo hosted-runner time consumes monthly allowance.
# Run on main, on ready-for-review PR changes, or deliberately via Actions UI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hal-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Playwright 1.51.1 supports 24.04; do not drift with ubuntu-latest.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:python
      - run: npm test
      - run: npm run test:web-engine
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  android:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: android/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: python3 android/tests/check_release_identity.py
      - run: npm ci
        working-directory: android
      - name: Rebuild Android UI bundle
        run: npm run assets
        working-directory: android
      - name: Upload reproducible Android assets
        uses: actions/upload-artifact@v4
        with:
          name: HAL-Desk-generated-assets
          path: |
            android/app/src/main/assets/desk4.js
            android/web-assets-sha256.json
          retention-days: 7
          if-no-files-found: error
      - run: npm test
        working-directory: android
      - name: Ensure compiled WebView files are not tracked
        run: |
          ! git ls-files --error-unmatch android/app/src/main/assets/desk4.js >/dev/null 2>&1
          ! git ls-files --error-unmatch android/web-assets-sha256.json >/dev/null 2>&1
      - name: Verify regenerated Android asset hashes
        run: node -e "const fs=require('fs'),c=require('crypto'),p=JSON.parse(fs.readFileSync('web-assets-sha256.json'));for(const [f,h] of Object.entries(p)){if(c.createHash('sha256').update(fs.readFileSync('app/src/main/assets/'+f)).digest('hex')!==h)process.exit(1)}console.log('All regenerated assets match SHA256 manifest')"
        working-directory: android
      - run: bash android/tests/test-native-ai.sh
      - name: Install Android SDK 35
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Native tests, lint and unsigned APK
        run: HAL_UNSIGNED_ONLY=1 ANDROID_SDK_ROOT="$ANDROID_HOME" bash android/build.sh
      - name: Upload unsigned candidate and test reports
        uses: actions/upload-artifact@v4
        with:
          name: HAL-Desk-v5.0.0-alpha.1-unsigned-and-reports
          path: |
            android/build/HAL-Desk-v5.0.0-alpha.1-unsigned.apk
            android/app/build/reports/tests/testReleaseUnitTest/
            android/app/build/reports/lint-results-release.html
          retention-days: 7
          if-no-files-found: error
      - run: npx playwright install --with-deps chromium
        working-directory: android
      - run: npm run test:ui
        working-directory: android
      - name: Upload Android UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HAL-Desk-ui-previews
          path: qa/*.png
          retention-days: 7
          if-no-files-found: warn
